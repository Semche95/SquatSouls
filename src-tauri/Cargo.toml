[package]
name = "squat-souls"
version = "0.1.0"
description = "Tire un exercice et un nombre de répétitions selon les événements des jeux"
edition = "2021"

[lib]
name = "squat_souls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
ureq = "3.4.2"
refinery = { version = "0.9", features = ["rusqlite"] }
