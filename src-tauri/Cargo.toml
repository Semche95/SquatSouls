[package]
name = "squat-souls"
version = "0.1.0"
description = "Turns in-game events into bodyweight exercises with a random number of reps"
edition = "2021"

[lib]
name = "squat_souls_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
ureq = "3.4.2"
tauri-plugin-notification = "2"
refinery = { version = "0.9", features = ["rusqlite"] }
sys-locale = "0.3"
log = "0.4"
tauri-plugin-log = "2"

[target."cfg(target_os = \"linux\")".dependencies]
notify-rust = "4.18"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
