name: Tests

# On every branch push and pull request, and before each build: interface tests on Linux, backend tests and clippy
# on the three systems.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A new push on the same branch or pull request cancels the run still in progress.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      # The interface tests run in jsdom against a mocked backend, so the system changes nothing for them.
      - run: pnpm test
        if: runner.os == 'Linux'

      # The backend compiles against the interface built in dist/.
      - run: pnpm build

      - run: cargo test
        working-directory: src-tauri

      # Each system compiles its own platform code.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
