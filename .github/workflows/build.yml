name: Build

# Run by hand: packages as artifacts. On a v* tag: draft GitHub release with the packages, their signatures,
# latest.json, read by the app's updater once the draft is published (release.yml then keeps its notes in step
# with the release), and the catalog of games.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Release notes from the Conventional Commits since the previous tag, grouped by cliff.toml.
  notes:
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The updater compares the installed version with the one built from package.json, not with the tag.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version package.json)
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, package.json $version, Cargo.toml $cargo_version: bump the version before tagging"
            exit 1
          fi

      - id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: ${{ startsWith(github.ref, 'refs/tags/v') && '--current' || '--unreleased' }}

  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [notes, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          target: ${{ matrix.target }}

      # Without a tag, tagName is empty and nothing is published. The release configuration adds the update
      # signatures, made with the private key kept in the repository secrets. Asset names carry no version, so the
      # README download links (releases/latest/download/...) keep pointing to the latest release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Squat Souls ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.content }}
          releaseDraft: true
          assetNamePattern: SquatSouls_[arch][setup][ext]
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: squat-souls-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Games of the default configuration as share texts, read by the app at
  # releases/latest/download/catalog.<language>.json: published with the release, so the catalog is always written
  # in the share format of the latest release, which the apps up to date can read.
  catalog:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Attach the catalog to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/catalog.js .
          gh release upload "$GITHUB_REF_NAME" catalog.*.json --clobber
