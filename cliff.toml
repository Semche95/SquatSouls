# Release notes generated by git-cliff from the Conventional Commits of a tag range (see .github/workflows/build.yml).
# The changes visible to users come first, the internal ones are listed apart so the notes are never empty.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", group = "<!-- 3 -->Under the hood" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
